name: Sync Strava Workouts

on:
  schedule:
    - cron: "0 6,20 * * *" # Si avvia in automatico ogni giorno alle 06:00 e alle 20:00 UTC
  workflow_dispatch:       # Permette l'avvio manuale con un clic

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa dipendenze
        run: pip install requests

      - name: Sincronizza allenamenti da Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python sync_strava.py

      - name: Salva CSV aggiornato su GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add workouts.csv
          git diff --quiet && git diff --staged --quiet || (git commit -m "Aggiorna allenamenti Strava" && git push)
